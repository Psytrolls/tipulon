services:
  tipulon:
    build: .
    container_name: tipulon_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Jerusalem
      - SESSION_SECRET=${SESSION_SECRET}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - BACKUP_EMAIL=${BACKUP_EMAIL}
    volumes:
      - ./data:/app/data
      - /mnt/tank/tipulon_backups:/app/data/backups

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tipulon_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://tipulon:3000
    depends_on:
      - tipulon
