services:
  tipulon:
    build: .
    container_name: tipulon_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Jerusalem
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tipulon_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://tipulon:3000
    depends_on:
      - tipulon
